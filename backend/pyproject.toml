[project]
name = "guad-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "python-json-logger>=2.0.7",
  "pyproj>=3.7.0",
  "duckdb>=1.3.0",
  "pyarrow>=20.0.0",
  "osmium>=4.0.0",
  "beautifulsoup4>=4.13.0",
  "requests>=2.32.0",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
