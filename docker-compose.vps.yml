services:
  guad:
    build:
      context: ${GUAD_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    image: guad-enterprises-app:${GUAD_IMAGE_TAG:-latest}
    container_name: guad-enterprises-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
